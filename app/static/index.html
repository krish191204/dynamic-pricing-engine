<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pricing and inventory</title>
  <style>
    :root { color-scheme: light; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --bg: #fafaf9; --card: #fff; }
    body { margin: 0; font: 16px/1.45 Georgia, "Iowan Old Style", serif; color: var(--ink); background: var(--bg); }
    main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.7rem; font-weight: 600; margin: 0 0 8px; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    form, section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font: 13px/1.3 ui-sans-serif, system-ui, sans-serif; margin-bottom: 10px; }
    input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: 15px ui-sans-serif, system-ui, sans-serif; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    button { font: 14px ui-sans-serif, system-ui, sans-serif; padding: 8px 12px; border-radius: 8px; border: 1px solid #1c1917; background: #1c1917; color: #fff; cursor: pointer; }
    button.ghost { background: #fff; color: #1c1917; }
    .metric { font: 28px/1.1 ui-sans-serif, system-ui, sans-serif; margin: 0; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #f5f5f4; font: 12px ui-sans-serif, system-ui, sans-serif; }
    .bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; }
    .bars div { flex: 1; background: #44403c; border-radius: 4px 4px 0 0; min-height: 4px; position: relative; }
    .bars span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font: 11px ui-sans-serif, system-ui, sans-serif; }
    .error { color: #9f1239; font: 14px ui-sans-serif, system-ui, sans-serif; }
    ul { margin: 8px 0 0; padding-left: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Pricing and inventory</h1>
    <p class="lead">Ten agents forecast next week and recommend hold, mark down, or raise. A manager still has to approve it.</p>
    <form id="run-form">
      <div class="row">
        <label>Product<input name="product_code" value="JACKET-01" required /></label>
        <label>Stock on hand<input name="stock_on_hand" type="number" min="0" value="400" required /></label>
        <label>Unit cost<input name="unit_cost" type="number" min="0" step="0.01" value="40" required /></label>
      </div>
      <div class="actions">
        <button type="submit">Run recommendation</button>
        <button class="ghost" type="button" onclick="run('hold')">Approve hold</button>
        <button class="ghost" type="button" onclick="run('mark_down')">Approve markdown</button>
        <button class="ghost" type="button" onclick="run('raise')">Approve raise</button>
      </div>
    </form>
    <section id="result"><p class="lead">No run yet.</p></section>
  </main>
  <script>
    const form = document.querySelector("#run-form");
    const result = document.querySelector("#result");

    function payload(override) {
      const data = new FormData(form);
      return {
        product_code: data.get("product_code"),
        stock_on_hand: Number(data.get("stock_on_hand")),
        unit_cost: Number(data.get("unit_cost")),
        manager_override: override || null
      };
    }

    async function run(override) {
      result.innerHTML = "<p>Running the ten agents…</p>";
      const response = await fetch("/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload(override))
      });
      const body = await response.json();
      if (!response.ok || (body.errors && body.errors.length)) {
        result.innerHTML = `<p class="error">${(body.errors || ["Request failed"]).join(" ")}</p>`;
        return;
      }
      const board = body.dashboard;
      const max = Math.max(...board.history.map((row) => row.quantity), board.forecast_units || 0, 1);
      const bars = board.history.map((row) => {
        const height = Math.round((row.quantity / max) * 120);
        return `<div style="height:${height}px"><span>${row.quantity}</span></div>`;
      }).join("");
      result.innerHTML = `
        <p><span class="tag">${board.status}</span> <span class="tag">${board.price_action.replace("_", " ")}</span> <span class="tag">${board.inventory_alert}</span></p>
        <p class="metric">${board.forecast_units} units next week</p>
        <p>${board.forecast_method}. Current price ${board.current_price}, suggested ${board.suggested_price}.</p>
        <p>${board.pricing_reason}</p>
        <p>${board.inventory_reason}</p>
        <div class="bars">${bars}</div>
        <p>${board.evaluation}</p>
        <ul>${board.guardrails.map((note) => `<li>${note}</li>`).join("")}</ul>
      `;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      run(null);
    });
    window.run = run;
    run(null);
  </script>
</body>
</html>
